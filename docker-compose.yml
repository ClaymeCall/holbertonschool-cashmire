services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cashmire}
      POSTGRES_USER: ${POSTGRES_USER:-cashmire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashmire}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cashmire}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Internal container-to-container port; POSTGRES_PORT in .env is the
      # host-published port and may differ. POSTGRES_HOST is left unset —
      # settings.py auto-detects the `db` service hostname.
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      network: host
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  pgdata:
